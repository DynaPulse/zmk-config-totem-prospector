CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

# ZMK Studio over USB. RPC transport comes from the studio-rpc-usb-uart snippet
# in build.yaml; locking disabled so the dongle is editable on connect.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Main-screen layout style (0=Dashboard, 1=Focus, 2=Minimal).
# Replaces the legacy PROSPECTOR_STATUS_SCREEN_OPERATOR symbol, which the
# prospector-touch module does not define.
CONFIG_PROSPECTOR_DEFAULT_LAYOUT=1

